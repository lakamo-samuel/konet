name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konet-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: konet-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test frontend helpers
        run: |
          npm run test:auth-transport
          npm run test:uploads
          npm run test:money-input
          npm run test:payment-redirect
          npm run test:realtime
          npm run test:settings-client
      - name: Build production app
        run: npm run build
      - name: Test production HTTP integration
        run: npm run test:integration
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test admin browser flows
        run: npm run test:admin
      - name: Test user browser flows
        run: npm run test:ui

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_TEST_DB_SOCKET: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: konet-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: konet-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production API
        run: npm run build
